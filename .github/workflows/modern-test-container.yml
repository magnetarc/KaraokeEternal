name: Modern container
on:
  push:
    branches: [modern-browser, party-usability, queue-controls]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build -f Dockerfile -t karaoke-modern:ci .
      - name: Check override selection on Synology-style BusyBox ash
        run: |
          sh scripts/test-nas-compose.sh
          sh scripts/test-nas-image-identity.sh
          docker run --rm --mount type=bind,source="$PWD",target=/work,readonly -w /work busybox:1.28 sh scripts/test-nas-compose.sh
          docker run --rm --mount type=bind,source="$PWD",target=/work,readonly -w /work busybox:1.28 sh scripts/test-nas-image-identity.sh
      - name: Check NAS installer shell syntax and production Compose
        run: |
          sh -n install-nas.sh
          sh -n repair-media-access.sh
          sh -n diagnose-nas-access.sh
          sh -n update-nas.sh
          sh -n scripts/nas-compose.sh
          docker compose -p karaoke-modern -f compose.yaml config --quiet
      - name: Check production metadata import and HTTP startup
        run: node scripts/docker-smoke.mjs karaoke-modern:ci production
      - name: Check isolated QA metadata import and HTTP startup
        run: node scripts/docker-smoke.mjs karaoke-modern:ci
      - name: Verify selected backing tracks in the Linux image
        run: node scripts/docker-versions-smoke.mjs karaoke-modern:ci
      - name: Reproduce private media permissions and verify NAS repair
        run: node scripts/nas-access-smoke.mjs karaoke-modern:ci
      - name: Import and run the modern export on NAS-era Docker 24
        if: matrix.arch == 'amd64'
        run: node scripts/docker24-image-smoke.mjs karaoke-modern:ci
      - name: Export verified image
        run: |
          mkdir -p image-export
          docker tag karaoke-modern:ci karaoke-modern:local
          docker save karaoke-modern:local | gzip -1 > image-export/karaoke-modern-image.tar.gz
          (cd image-export && sha256sum karaoke-modern-image.tar.gz > karaoke-modern-image.tar.gz.sha256)
          docker image inspect --format '{{.Id}}' karaoke-modern:local > image-export/image-id.txt
          python3 scripts/image-config-id.py image-export/karaoke-modern-image.tar.gz --arch '${{ matrix.arch }}' > image-export/image-config-id.txt
          echo '${{ github.sha }}' > image-export/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: karaoke-modern-image-${{ matrix.arch }}
          path: image-export/*
          compression-level: 0
          retention-days: 14
