name: Modern container
on:
  push:
    branches: [modern-browser]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build -f Dockerfile -t karaoke-modern:ci .
      - name: Check NAS installer shell syntax and production Compose
        run: |
          sh -n install-nas.sh
          docker compose -p karaoke-modern -f compose.yaml config --quiet
      - name: Check production metadata import and HTTP startup
        run: node scripts/docker-smoke.mjs karaoke-modern:ci production
      - name: Check isolated QA metadata import and HTTP startup
        run: node scripts/docker-smoke.mjs karaoke-modern:ci
